<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contextlens — 결과 업로드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; }

    /* NAV */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid #e0e0e0;
      background: #fff;
    }
    .logo { font-size: 16px; font-weight: 500; }
    .logo span { color: #2563eb; }
    .back-btn {
      font-size: 13px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: none;
      border: none;
    }
    .back-btn:hover { color: #1a1a1a; }

    /* MAIN */
    .main { max-width: 560px; margin: 0 auto; padding: 36px 24px 60px; }
    .page-title { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
    .page-sub { font-size: 13px; color: #666; margin-bottom: 32px; }

    /* SECTION */
    .section { margin-bottom: 24px; }
    .label { font-size: 13px; font-weight: 500; color: #1a1a1a; margin-bottom: 6px; display: block; }
    .sublabel { font-size: 12px; color: #aaa; margin-bottom: 8px; }

    /* INPUTS */
    input[type=text], textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      font-size: 13px;
      font-family: inherit;
    }
    input[type=text]:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
    }
    textarea { resize: vertical; min-height: 100px; line-height: 1.6; }

    /* SOURCE BUTTONS */
    .source-group { display: flex; gap: 8px; }
    .source-btn {
      flex: 1;
      padding: 9px 0;
      font-size: 13px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      background: #fff;
      color: #555;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .source-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .source-btn:hover:not(.active) { border-color: #bbb; }

    /* FILE DROP */
    .file-drop {
      border: 1.5px dashed #c0c0c0;
      border-radius: 12px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      background: #fff;
      transition: border-color 0.15s;
    }
    .file-drop:hover { border-color: #2563eb; }
    .file-drop i { font-size: 28px; color: #aaa; }
    .file-drop-title { font-size: 14px; color: #555; font-weight: 500; }
    .file-drop-sub { font-size: 12px; color: #aaa; }

    /* DIVIDER */
    .divider { height: 1px; background: #e0e0e0; margin: 24px 0; }

    /* AUTO SECTION */
    .auto-section {
      background: #eeecea;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e0e0e0;
    }
    .auto-title {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .auto-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .auto-row:last-child { border-bottom: none; }
    .auto-key { font-size: 13px; color: #555; }
    .auto-val { font-size: 13px; color: #aaa; font-style: italic; }

    /* SUBMIT */
    .submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 11px;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .submit-btn:hover { background: #333; }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="logo">context<span>lens</span></span>
    <button class="back-btn" id="btnBack">
      <i class="ti ti-arrow-left"></i> 아카이브로 돌아가기
    </button>
  </nav>

  <form class="main" id="uploadForm">
    <h1 class="page-title">분석 결과 업로드</h1>
    <p class="page-sub">분석 정보와 JSON 데이터를 입력해주세요</p>

    <div class="section">
      <label class="label">닉네임</label>
      <input type="text" id="uploaderName" placeholder="공개될 닉네임을 입력하세요">
    </div>

    <div class="section">
      <label class="label">분석 키워드</label>
      <input type="text" id="targetKeyword" placeholder="예) MZ세대, 기후위기">
    </div>

    <div class="section">
      <label class="label">조사 출처</label>
      <div class="source-group">
        <div class="source-btn active" data-source="news">뉴스</div>
        <div class="source-btn" data-source="community">커뮤니티</div>
        <div class="source-btn" data-source="mixed">혼합</div>
      </div>
    </div>

    <div class="section">
      <label class="label">분석 기간</label>
      <input type="text" id="analysisPeriod" placeholder="예) 2026.01 - 2026.06">
    </div>

    <div class="section">
      <label class="label">분석 설명</label>
      <p class="sublabel">아카이브 카드에 표시됩니다</p>
      <textarea id="analysisDesc" placeholder="예) MZ세대 옆에 갈등, 태도, 문제 등 부정적 단어의 유사도가 상위권에 집중됨."></textarea>
    </div>

    <div class="section">
      <label class="label">수집 건수</label>
      <p class="sublabel">분석에 사용된 데이터 건수를 입력하세요</p>
      <input type="text" id="totalCount" placeholder="예) 1240">
    </div>

    <div class="section">
      <label class="label">태그</label>
      <p class="sublabel">쉼표로 구분해서 입력하세요</p>
      <input type="text" id="tags" placeholder="예) 세대, 미디어, 청년">
    </div>

    <div class="section">
      <label class="label">분석 결과 파일</label>
      <p class="sublabel">근연도 분석 결과 JSON 파일을 첨부하세요</p>
      
      <input type="file" id="jsonFile" accept=".json" style="display: none;">
      
      <div class="file-drop" id="dropZone">
        <i class="ti ti-file-code"></i>
        <span class="file-drop-title" id="fileTitle">파일을 끌어다 놓거나 클릭해서 선택</span>
        <span class="file-drop-sub">.json 파일만 가능</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="auto-section">
      <div class="auto-title">자동으로 처리되는 정보</div>
      <div class="auto-row">
        <span class="auto-key">업로드 시간</span>
        <span class="auto-val">업로드 시 자동 기록</span>
      </div>
      <div class="auto-row">
        <span class="auto-key">시각화 차트 생성</span>
        <span class="auto-val">JSON 데이터 기반 자동 렌더링</span>
      </div>
    </div>

    <button type="submit" class="submit-btn">업로드하기</button>
  </form>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('jsonFile');
    const fileTitle = document.getElementById('fileTitle');
    const uploadForm = document.getElementById('uploadForm');
    const btnBack = document.getElementById('btnBack');

    // 1. 뒤로가기 버튼 링크 연동
    btnBack.addEventListener('click', () => {
      location.href = 'archive.html';
    });

    // 2. 출처 선택 토글 UI 제어
    const sourceBtns = document.querySelectorAll('.source-btn');
    sourceBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        sourceBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // 3. 파일 드롭박스 클릭 및 Drag & Drop 제어
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#2563eb';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.borderColor = '#c0c0c0';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#c0c0c0';
      if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        handleFileSelect(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    // 4. 진짜 파일 데이터 파싱 및 유효성 검증 핵심 로직
    function handleFileSelect(file) {
      if (!file.name.endsWith('.json')) {
        alert('❌ JSON 파일만 업로드할 수 있습니다!');
        fileInput.value = '';
        fileTitle.textContent = "파일을 끌어다 놓거나 클릭해서 선택";
        fileTitle.style.color = "#555";
        return;
      }

      fileTitle.textContent = "✓ 연결된 파일: " + file.name;
      fileTitle.style.color = "#2563eb";

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const jsonData = JSON.parse(event.target.result);
          console.log("=== 파싱된 JSON 데이터 결과 ===", jsonData);
          
          // 데이터 내부 규격 검사
          if (!jsonData.keyword || !jsonData.related_words) {
            alert("⚠️ 경고: 데이터 규격이 올바르지 않습니다. (keyword 또는 related_words 구조 유실)");
          } else {
            alert(`✅ 구조 확인 성공! 분석 대상 키워드: [ ${jsonData.keyword} ] 데이터가 확인되었습니다.`);
          }
        } catch (err) {
          alert("❌ 올바른 JSON 포맷 형식이 아닙니다. 파일 내용을 다시 확인해 주세요.");
        }
      };
      reader.readAsText(file);
    }

    // 5. 최종 폼 서밋 버튼 이벤트
    uploadForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if (!fileInput.files[0]) {
        alert("분석 결과 JSON 파일을 먼저 첨부해 주세요!");
        return;
      }

      alert("🎉 데이터 처리가 완료되었습니다!\n(공모전 프로토타입 단계 완료: 메인 아카이브로 이동합니다.)");
      location.href = 'archive.html';
    });
  </script>

</body>
</html>
