<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contextlens — 분석 상세 결과</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; }

    /* NAV */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid #e0e0e0;
      background: #fff;
    }
    .logo { font-size: 16px; font-weight: 500; }
    .logo span { color: #2563eb; }
    .back-btn {
      font-size: 13px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: none;
      border: none;
    }
    .back-btn:hover { color: #1a1a1a; }

    /* MAIN CONTAINER */
    .container { max-width: 960px; margin: 0 auto; padding: 32px 24px 60px; }
    
    /* HEADER SECTION */
    .header-section { margin-bottom: 28px; }
    .meta-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .badge { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; }
    .badge.news { background: #eff6ff; color: #1d4ed8; }
    .period { font-size: 12px; color: #aaa; }
    .title { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    .desc { font-size: 14px; color: #555; line-height: 1.6; }
    .meta-bottom { font-size: 12px; color: #aaa; margin-top: 12px; border-bottom: 1px solid #e0e0e0; padding-bottom: 16px; }

    /* DASHBOARD GRID */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
    @media (max-width: 768px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    /* CARD PANEL */
    .panel { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; }
    .panel-title { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
    
    /* WORD LIST */
    .word-list { display: flex; flex-direction: column; gap: 10px; }
    .word-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee; }
    .word-rank { font-size: 12px; font-weight: bold; color: #2563eb; width: 20px; }
    .word-name { font-size: 13px; font-weight: 500; flex: 1; margin-left: 4px; }
    .word-bar-wrap { width: 120px; background: #e0e0e0; height: 6px; border-radius: 3px; margin: 0 12px; overflow: hidden; }
    .word-bar { height: 100%; background: #2563eb; border-radius: 3px; }
    .word-score { font-size: 12px; font-family: monospace; color: #555; font-weight: bold; width: 40px; text-align: right; }
    .sentiment-dot { width: 6px; height: 6px; border-radius: 50%; margin-left: 8px; }
    .sentiment-dot.negative { background: #ef4444; }
    .sentiment-dot.positive { background: #10b981; }
    .sentiment-dot.neutral { background: #6b7280; }

    /* CHART WRAPPER */
    .chart-wrap { display: flex; align-items: center; justify-content: center; height: 220px; position: relative; }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="logo">context<span>lens</span></span>
    <button class="back-btn" id="btnBack">
      <i class="ti ti-arrow-left"></i> 아카이브 목록으로
    </button>
  </nav>

  <div class="container">
    <header class="header-section">
      <div class="meta-top">
        <span class="badge news">뉴스</span>
        <span class="period">분석 기간: 2026.01 - 2026.06</span>
      </div>
      <h1 class="title" id="keywordTitle">"MZ세대" 근연도 분석 결과</h1>
      <p class="desc">
        포털 뉴스 기사 수집 결과, 타겟 키워드와 함께 가장 자주 등장하고 밀접한 연관성을 가진 단어들의 정량적 근연도 지도 데이터입니다.
      </p>
      <div class="meta-bottom">
        <i class="ti ti-database"></i> 총 수집 건수: 1,240건 &nbsp;·&nbsp; 분석 방식: 단어 임베딩 근연도 조사
      </div>
    </header>

    <div class="dashboard-grid">
      
      <div class="panel">
        <h2 class="panel-title"><i class="ti ti-list-numbers"></i> 근연도 상위 연관어 (Top 4)</h2>
        <div class="word-list">
          <div class="word-item">
            <span class="word-rank">1</span>
            <span class="word-name">갈등</span>
            <div class="word-bar-wrap"><div class="word-bar" style="width: 89%;"></div></div>
            <span class="word-score">0.89</span>
            <span class="sentiment-dot negative" title="부정적 문맥"></span>
          </div>
          <div class="word-item">
            <span class="word-rank">2</span>
            <span class="word-name">태도</span>
            <div class="word-bar-wrap"><div class="word-bar" style="width: 82%;"></div></div>
            <span class="word-score">0.82</span>
            <span class="sentiment-dot neutral" title="중립적 문맥"></span>
          </div>
          <div class="word-item">
            <span class="word-rank">3</span>
            <span class="word-name">문제</span>
            <div class="word-bar-wrap"><div class="word-bar" style="width: 78%;"></div></div>
            <span class="word-score">0.78</span>
            <span class="sentiment-dot negative" title="부정적 문맥"></span>
          </div>
          <div class="word-item">
            <span class="word-rank">4</span>
            <span class="word-name">공정</span>
            <div class="word-bar-wrap"><div class="word-bar" style="width: 71%;"></div></div>
            <span class="word-score">0.71</span>
            <span class="sentiment-dot positive" title="긍정적 문맥"></span>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2 class="panel-title"><i class="ti ti-chart-pie"></i> 연관 단어 문맥 성향 분포</h2>
        <div class="chart-wrap">
          <canvas id="sentimentChart"></canvas>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 아카이브로 돌아가기 버튼 작동 기본 라우팅
    document.getElementById('btnBack').addEventListener('click', () => {
      location.href = 'archive.html';
    });

    // Chart.js를 이용해 샘플 JSON 데이터를 기반으로 도넛 차트 그리기
    const ctx = document.getElementById('sentimentChart').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['부정적 문맥', '중립적 문맥', '긍정적 문맥'],
        datasets: [{
          data: [50, 25, 25], // 샘플 비율 수치
          backgroundColor: ['#ef4444', '#6b7280', '#10b981'],
          borderWidth: 2,
          hoverOffset: 4
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 12 } } }
        }
      }
    });
  </script>
</body>
</html>
